# All 5 liquid architectures plus 4 non-liquid/hybrid baselines (RNN,
# CT-RNN, Neural ODE, Liquid-LSTM) on the same short-sequence binary
# classification task, so accuracy/params/train-time are directly comparable.
dataset: room_occupancy
dataset_kwargs:
  seq_len: 16
epochs: 15
batch_size: 32
lr: 0.01
models:
  rnn:
    hidden_size: 32
  ctrnn:
    hidden_size: 32
  node:
    hidden_size: 32
  liquid_lstm:
    hidden_size: 32
  ltc:
    hidden_size: 32
  cfc:
    hidden_size: 32
  ncp: {}
  liquid_s4:
    state_size: 32
  lrcssm:
    state_size: 32
