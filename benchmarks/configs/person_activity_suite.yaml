# All 5 architectures on the 11-way UCI Person Activity task (the exact
# dataset used in the CfC/NCP papers).
dataset: person_activity
dataset_kwargs:
  seq_len: 25
epochs: 20
batch_size: 32
lr: 0.001
models:
  ltc:
    hidden_size: 48
  cfc:
    hidden_size: 48
  ncp: {}
  liquid_s4:
    state_size: 48
  lrcssm:
    state_size: 48
