# All 5 liquid architectures plus 4 non-liquid/hybrid baselines (RNN,
# CT-RNN, Neural ODE, Liquid-LSTM) on the 11-way UCI Person Activity task
# (the exact dataset used in the CfC/NCP papers).
dataset: person_activity
dataset_kwargs:
  seq_len: 25
epochs: 20
batch_size: 32
lr: 0.001
models:
  rnn:
    hidden_size: 48
  ctrnn:
    hidden_size: 48
  ctgru:
    hidden_size: 48
  node:
    hidden_size: 48
  liquid_lstm:
    hidden_size: 48
  ltc:
    hidden_size: 48
  cfc:
    hidden_size: 48
  ncp: {}
  liquid_s4:
    state_size: 48
  lrcssm:
    state_size: 48
